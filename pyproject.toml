[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanquaycve"
version = "0.1.0"
description = "Scan Quay/Clair vulnerability reports by image tag or digest"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
scanquaycve = "scanquaycve.cli:main"

[project.urls]
Repository = "https://github.com/takumar/scanquaycve"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["scanquaycve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
