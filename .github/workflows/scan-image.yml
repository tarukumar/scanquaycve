name: Scan Quay image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image reference (e.g. quay.io/org/image:tag)"
        required: true
        type: string
      min_severity:
        description: "Minimum severity to include (Critical > High > Medium > Low > Negligible > Unknown)"
        required: false
        default: "High"
        type: choice
        options:
          - Critical
          - High
          - Medium
          - Low
          - Negligible
          - Unknown
      fixable_only:
        description: "Only include CVEs with a known fix"
        required: false
        default: false
        type: boolean
      arch:
        description: "Architecture for multi-arch tags"
        required: false
        default: "amd64"
        type: string
      fail_on_findings:
        description: "Fail the job when any matching vulnerabilities are found"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ inputs.image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: "quay.io"
          username: ${{ secrets.QUAY_AIPCC_USERNAME }}
          password: ${{ secrets.QUAY_AIPCC_TOKEN }}
          
      - name: Install scanquaycve
        run: pip install .

      - name: Run vulnerability scan
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          IMAGE: ${{ inputs.image }}
          MIN_SEVERITY: ${{ inputs.min_severity }}
          FIXABLE_ONLY: ${{ inputs.fixable_only }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          args=(
            "$IMAGE"
            --min-severity "$MIN_SEVERITY"
            --arch "$ARCH"
            -o reports
            --json
          )
          if [[ "$FIXABLE_ONLY" == "true" ]]; then
            args+=(--fixable-only)
          fi
          if [[ -n "${QUAY_TOKEN:-}" ]]; then
            args+=(--token "$QUAY_TOKEN")
          fi
          scanquaycve "${args[@]}"

      - name: Write job summary
        if: always()
        env:
          IMAGE: ${{ inputs.image }}
          MIN_SEVERITY: ${{ inputs.min_severity }}
          FIXABLE_ONLY: ${{ inputs.fixable_only }}
          ARCH: ${{ inputs.arch }}
        run: |
          python <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = next(Path("reports").rglob("summary.json"), None)
          out = os.environ["GITHUB_STEP_SUMMARY"]
          image = os.environ.get("IMAGE", "")
          min_sev = os.environ.get("MIN_SEVERITY", "")
          fixable_only = os.environ.get("FIXABLE_ONLY", "false")
          arch = os.environ.get("ARCH", "amd64")

          lines = [
              "## scanquaycve results",
              "",
              f"- **Image:** `{image}`",
              f"- **Arch:** `{arch}`",
              f"- **Min severity:** `{min_sev}`",
              f"- **Fixable only:** `{fixable_only}`",
              "",
          ]

          if summary_path is None:
              lines += ["_No `summary.json` found — scan may have failed before writing reports._", ""]
              Path(out).write_text("\n".join(lines), encoding="utf-8")
              raise SystemExit(0)

          data = json.loads(summary_path.read_text(encoding="utf-8"))
          meta = data.get("meta", {})
          digest = meta.get("digest", "")
          status = meta.get("status", "")
          total = data.get("total", 0)
          fixable = data.get("fixable", 0)
          non_fixable = data.get("non_fixable", 0)

          lines += [
              f"- **Digest:** `{digest}`",
              f"- **Scan status:** `{status}`",
              f"- **Report:** `{summary_path.parent}`",
              "",
              "| Severity | Fixable | Non-fixable | Total |",
              "| --- | ---: | ---: | ---: |",
          ]
          for sev, counts in (data.get("by_severity") or {}).items():
              row_total = counts.get("total", 0)
              if row_total == 0:
                  continue
              lines.append(
                  f"| {sev} | {counts.get('fixable', 0)} | "
                  f"{counts.get('non_fixable', 0)} | {row_total} |"
              )
          lines += [
              f"| **TOTAL** | **{fixable}** | **{non_fixable}** | **{total}** |",
              "",
          ]
          Path(out).write_text("\n".join(lines), encoding="utf-8")
          print(f"Wrote job summary from {summary_path} (total={total})")
          PY

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanquaycve-reports
          path: reports/
          if-no-files-found: warn

      - name: Fail on findings
        if: ${{ inputs.fail_on_findings }}
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          summary="$(find reports -name summary.json | head -n 1 || true)"
          if [[ -z "$summary" ]]; then
            echo "No summary.json found; skipping fail-on-findings check."
            exit 0
          fi
          total="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["total"])' "$summary")"
          echo "Matching vulnerabilities: $total"
          if [[ "$total" -gt 0 ]]; then
            echo "::error::Found $total matching vulnerabilities in $IMAGE"
            exit 1
          fi
